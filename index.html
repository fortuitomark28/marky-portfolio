<head>

  <meta property="og:description" content="Building systems, apps, and tools with purpose and passion. Check out my portfolio.">

  <meta property="og:url" content="https://marky-portfolio-red.vercel.app">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mark Fortuito — Developer">
  <meta name="twitter:description" content="Building systems, apps, and tools with purpose and passion.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23111'/><text y='72' x='50' text-anchor='middle' font-size='52' font-family='monospace' font-weight='bold' fill='%23c8f135'>MF</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/projects.css">
  <link rel="stylesheet" href="styles/skills.css">
  <link rel="stylesheet" href="styles/journey.css">
  <link rel="stylesheet" href="styles/contact.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div id="loader">
    <div class="loader-initials">M<span>F</span></div>
    <div class="loader-bar"></div>
  </div>

  <!-- ── Nav ── -->
  <nav id="nav">
    <a href="#hero" class="nav-logo">mark<span>.</span>dev</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#journey">Journey</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="nav-burger" id="navBurger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- ── Mobile Menu ── -->
  <div class="mobile-menu-overlay" id="menuOverlay"></div>
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
      <span>MENU</span>
      <span id="menuCount">— 01 / 05</span>
    </div>
    <ul class="mobile-nav-links">
      <li>
        <a href="#about" class="mobile-nav-link">
          <span class="link-num">01</span>
          About
          <span class="link-arrow">↗</span>
        </a>
      </li>
      <li>
        <a href="#projects" class="mobile-nav-link">
          <span class="link-num">02</span>
          Projects
          <span class="link-arrow">↗</span>
        </a>
      </li>
      <li>
        <a href="#skills" class="mobile-nav-link">
          <span class="link-num">03</span>
          Skills
          <span class="link-arrow">↗</span>
        </a>
      </li>
      <li>
        <a href="#journey" class="mobile-nav-link">
          <span class="link-num">04</span>
          Journey
          <span class="link-arrow">↗</span>
        </a>
      </li>
      <li>
        <a href="#contact" class="mobile-nav-link">
          <span class="link-num">05</span>
          Contact
          <span class="link-arrow">↗</span>
        </a>
      </li>
    </ul>
    <div class="mobile-menu-footer">
      <span>V2026.01</span>
      <span>© 2026</span>
    </div>
  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <!-- ── Back to Top ── -->
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <!-- ── Section Slots ── -->
  <div id="hero-slot"></div>
  <div id="about-slot"></div>
  <div id="projects-slot"></div>
  <div id="skills-slot"></div>
  <div id="journey-slot"></div>
  <div id="contact-slot"></div>

  <footer>
    <div class="footer-copy">© 2026 Mark Fortuito. All rights reserved.</div>
    <div class="footer-center">
      Built with <span>love</span>
    </div>
    <a href="https://github.com/fortuitomark28" target="_blank" class="footer-github">
      github<span>↗</span>
    </a>
  </footer>

  <style>
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 48px;
      border-top: 1px solid var(--border);
    }
    .footer-copy {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .footer-center {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .footer-center span { color: var(--accent); }
    .footer-github {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .footer-github span {
      color: var(--accent);
      margin-left: 2px;
    }
    .footer-github:hover { color: var(--accent); }

    @media (max-width: 768px) {
      footer {
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 32px 24px;
      }
    }
  </style>

  <script>
    // ── Section loader ──
    const sections = ['hero', 'about', 'projects', 'skills', 'journey', 'contact'];
    let loaded = 0;

    sections.forEach(name => {
      fetch(`sections/${name}.html`)
        .then(r => r.text())
        .then(html => {
          const slot = document.getElementById(name + '-slot');
          slot.outerHTML = html;
          loaded++;
          if (loaded === sections.length) initScripts();
        })
        .catch(err => {
          console.error(`Failed to load: ${name}`, err);
          loaded++;
          if (loaded === sections.length) initScripts();
        });
    });

    function initScripts() {

      // ── Custom cursor ──
      const cursor = document.getElementById('cursor');
      const ring   = document.getElementById('cursorRing');
      document.documentElement.appendChild(cursor);
      document.documentElement.appendChild(ring);

      let mx = 0, my = 0, rx = 0, ry = 0;

      document.addEventListener('mousemove', e => {
        mx = e.clientX;
        my = e.clientY;
        cursor.style.transform = `translate(${mx - 4}px, ${my - 4}px)`;
      });

      (function animateRing() {
        rx += (mx - rx) * 0.12;
        ry += (my - ry) * 0.12;
        ring.style.transform = `translate(${rx - 16}px, ${ry - 16}px)`;
        requestAnimationFrame(animateRing);
      })();

      function addCursorHover(selector) {
        document.querySelectorAll(selector).forEach(el => {
          el.addEventListener('mouseenter', () => {
            cursor.classList.add('hover');
            ring.classList.add('hover');
          });
          el.addEventListener('mouseleave', () => {
            cursor.classList.remove('hover');
            ring.classList.remove('hover');
          });
        });
      }
      addCursorHover('a, button, .skill-tag, .project-card, .filter-btn');

      // ── Loader ──
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden');
      }, 1600);

      // ── Back to top ──
      const backToTop = document.getElementById('back-to-top');
      backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      // ── Scroll events ──
      window.addEventListener('scroll', () => {
        document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 50);
        backToTop.classList.toggle('visible', window.scrollY > 400);
        updateActiveNav();
      });

      // ── Active nav highlight ──
      function updateActiveNav() {
        const ids   = ['hero', 'about', 'projects', 'skills', 'journey', 'contact'];
        const links = document.querySelectorAll('.nav-links a');
        let current = '';
        ids.forEach(id => {
          const el = document.getElementById(id);
          if (el && window.scrollY >= el.offsetTop - 120) current = id;
        });
        links.forEach(link => {
          link.classList.toggle('active', link.getAttribute('href') === '#' + current);
        });
      }
      updateActiveNav();

      // ── Intersection observer (reveal + timeline) ──
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal, .timeline-item').forEach(el => observer.observe(el));

      // ── Project filter ──
      const filterBtns   = document.querySelectorAll('.filter-btn');
      const projectCards = document.querySelectorAll('.project-card[data-type]');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          projectCards.forEach(card => {
            const match = filter === 'all' || card.dataset.type === filter;
            card.classList.toggle('hidden-card', !match);
          });
        });
      });

      // ── Carousels ──
      document.querySelectorAll('.project-carousel').forEach(carousel => {
        const track = carousel.querySelector('.carousel-track');
        const imgs  = track.querySelectorAll('img');
        const dots  = carousel.querySelector('.carousel-dots');
        let cur = 0;

        imgs.forEach((_, i) => {
          const dot = document.createElement('span');
          if (i === 0) dot.classList.add('active');
          dot.addEventListener('click', () => goTo(i));
          dots.appendChild(dot);
        });

        function goTo(index) {
          cur = (index + imgs.length) % imgs.length;
          track.style.transform = `translateX(-${cur * 100}%)`;
          dots.querySelectorAll('span').forEach((d, i) => d.classList.toggle('active', i === cur));
        }

        carousel.querySelector('.prev').addEventListener('click', () => goTo(cur - 1));
        carousel.querySelector('.next').addEventListener('click', () => goTo(cur + 1));

        if (imgs.length <= 1) {
          carousel.querySelector('.prev').style.display = 'none';
          carousel.querySelector('.next').style.display = 'none';
        }
      });

      // ── Lightbox ──
      const lightbox    = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');

      document.querySelectorAll('.carousel-track img').forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.classList.add('open');
        });
      });

      document.getElementById('lightbox-close').addEventListener('click', () => lightbox.classList.remove('open'));
      lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });

      // ── GitHub: repo languages (sessionStorage cached) ──
      const repos = [
        'VOTING-MANAGEMENT-SYSTEM-2025', 'HealTapSystem', 'RECENT-SYSTEM-2026',
        'kanin', 'CRUD-PROJECT', 'ayessa_project', 'ayessa_valentines'
      ];

      const cachedLangs = sessionStorage.getItem('gh_langs');

      if (cachedLangs) {
        JSON.parse(cachedLangs).forEach((lang, i) => {
          const el = document.getElementById(`lang-${i}`);
          if (el) el.textContent = lang;
        });
      } else {
        const langs = [];
        let done = 0;
        repos.forEach((repo, i) => {
          fetch(`https://api.github.com/repos/fortuitomark28/${repo}`)
            .then(r => r.json())
            .then(data => {
              langs[i] = data.language || 'Code';
              const el = document.getElementById(`lang-${i}`);
              if (el) el.textContent = langs[i];
            })
            .catch(() => {
              langs[i] = 'Code';
              const el = document.getElementById(`lang-${i}`);
              if (el) el.textContent = 'Code';
            })
            .finally(() => {
              if (++done === repos.length) {
                sessionStorage.setItem('gh_langs', JSON.stringify(langs));
              }
            });
        });
      }

      // ── GitHub: repo count (sessionStorage cached) ──
      const cachedCount = sessionStorage.getItem('gh_repocount');

      if (cachedCount) {
        const el = document.getElementById('repoCount');
        if (el) el.textContent = cachedCount;
      } else {
        fetch('https://api.github.com/users/fortuitomark28')
          .then(r => r.json())
          .then(data => {
            if (data.public_repos) {
              const el = document.getElementById('repoCount');
              if (el) el.textContent = data.public_repos;
              sessionStorage.setItem('gh_repocount', data.public_repos);
            }
          })
          .catch(() => {});
      }

      // ── Mobile menu ──
      const burger      = document.getElementById('navBurger');
      const mobileMenu  = document.getElementById('mobileMenu');
      const menuOverlay = document.getElementById('menuOverlay');
      const menuCount   = document.getElementById('menuCount');
      const mobileLinks = document.querySelectorAll('.mobile-nav-link');
      const total       = mobileLinks.length;
      let countInterval;

      function animateCounter(target) {
        let i = 1;
        clearInterval(countInterval);
        countInterval = setInterval(() => {
          menuCount.textContent = `— 0${i} / 0${total}`;
          i++;
          if (i > target) clearInterval(countInterval);
        }, 60);
      }

      function openMenu() {
        burger.classList.add('open');
        mobileMenu.classList.add('open');
        menuOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        animateCounter(total);
      }

      function closeMenu() {
        burger.classList.remove('open');
        mobileMenu.classList.remove('open');
        menuOverlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      burger.addEventListener('click', () => {
        burger.classList.contains('open') ? closeMenu() : openMenu();
      });

      menuOverlay.addEventListener('click', closeMenu);

      mobileLinks.forEach((link, i) => {
        link.addEventListener('click', closeMenu);
        link.addEventListener('mouseenter', () => {
          menuCount.textContent = `— 0${i + 1} / 0${total}`;
        });
      });

      // ── Global keyboard shortcuts ──
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeMenu();
          lightbox.classList.remove('open');
        }
      });
    }
  </script>
</body>
</html>
